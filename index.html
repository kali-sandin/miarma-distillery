<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Miarma Distillery · PoC</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="splashScreen" class="splash-screen hidden" role="button" aria-label="Pantalla inicial de Sim Distillery"><img src="img/splash.jpg" alt="Sim Distillery" draggable="false" /></div>
  <audio id="mainLoop" src="audio/main_loop.mp3" loop preload="auto"></audio>
  <audio id="fxDropGrain" src="fx/fx-drop_grain.mp3" preload="auto"></audio>
  <audio id="fxBubblesDrop" src="fx/bubbles-drop.mp3" preload="auto"></audio>
  <audio id="fxAhhh" src="fx/ahhh.mp3" preload="auto"></audio>
  <audio id="fxCashRegister" src="fx/cash_register.mp3" preload="auto"></audio>
  <audio id="fxChicharrasCicada" src="fx/chicharras-cicada.mp3" preload="auto"></audio>
  <audio id="fxCork" src="fx/cork.mp3" preload="auto"></audio>
  <audio id="fxFireLong" src="fx/fire-long.mp3" preload="auto"></audio>
  <audio id="fxFlameShort" src="fx/flame-short.mp3" preload="auto"></audio>
  <audio id="fxNewBottles" src="fx/new-bottles.mp3" preload="auto"></audio>
  <audio id="fxRottenFlies" src="fx/rotten-flies.mp3" preload="auto"></audio>
  <audio id="fxWater" src="fx/water.mp3" preload="auto"></audio>
  <audio id="fxWoodGrab" src="fx/wood-grab.mp3" preload="auto"></audio>
  <audio id="fxWoodRelease" src="fx/wood-release.mp3" preload="auto"></audio>
  <audio id="fxWarning" src="fx/warning.mp3" preload="auto"></audio>
  <audio id="fxSuccess" src="fx/fx-success.mp3" preload="auto"></audio>
  <audio id="fxEscocesGrumpy" src="fx/escoces_grumpy.mp3" preload="auto"></audio>
  <audio id="fxEscocesRumbling1" src="fx/escoces_rumbling1.mp3" preload="auto"></audio>
  <audio id="fxEscocesRumbling2" src="fx/escoces_rumbling2.mp3" preload="auto"></audio>
  <audio id="fxEscocesRumbling3" src="fx/escoces_rumbling3.mp3" preload="auto"></audio>
  <audio id="fxTruckStart" src="fx/truck_start.mp3" preload="auto"></audio>
  <audio id="fxTruckReverse" src="fx/truck_reverse.mp3" preload="auto"></audio>
  <main id="game" aria-label="Miarma Distillery PoC">
    <img id="finca" src="img/finca.jpg" alt="Finca pixel art de destilería" draggable="false" />

    <section id="hud" class="pixel-panel" data-tip="Panel general de la oficina: nombre, dinero, semillas, velocidad y acciones principales.">
      <label class="name-field">
        <strong id="distilleryNameView" class="name-view">Miarma Distillery</strong>
        <input id="distilleryName" maxlength="28" value="Miarma Distillery" autocomplete="off" />
        <button id="editName" class="pixel-btn small name-edit" type="button">Editar</button>
        <button id="toggleMusic" class="pixel-btn small icon-toggle" type="button" data-tip="Música de fondo: activar/desactivar.">🎵</button>
        <button id="toggleFx" class="pixel-btn small icon-toggle" type="button" data-tip="Efectos de sonido: activar/desactivar.">🔊</button>
        <button id="acceptName" class="pixel-btn small name-accept" type="button">Aceptar</button>
      </label>
      <div class="stats-grid" id="resources" data-tip="Recursos">
        <div class="stat resource-stat"><span>🪙</span><strong id="coins">10 k€</strong></div>
        <div class="stat resource-stat seed-inventory" id="seedInventory" data-drag="seed" data-tip="🌾 Semillas disponibles.
Arrastra este icono a una parcela vacía para plantar 20 Kg."><span>🌾</span><strong id="seeds">0 Kg</strong></div>
        <button class="stat resource-stat bottle-stat" id="bottleStat" type="button"><span>🍾</span><strong id="bottles">0</strong></button>
        <div class="stat resource-stat"><span>📈</span><strong id="market">3.5 €</strong></div>
      </div>
      <div class="action-row">
        <button id="buySeeds" class="pixel-btn" data-tip="Comprar semillas.
Precio: 1 k€.
Añade: 20 Kg.
Cada parcela consume 20 Kg.">Comprar semillas</button>
      </div>
      <label class="speed-control" data-tip="Velocidad del tiempo.
Rueda del ratón: cambia step a step.
Botón x1: vuelve a velocidad base.">
        <span>Tiempo <strong id="speedLabel">x1</strong></span>
        <button id="speedReset" class="pixel-btn small" type="button" data-tip="Restablecer tiempo a x1.">x1</button>
        <input id="speedSlider" type="range" min="-4" max="9" step="1" value="0" />
      </label>
      <div class="menu-buttons">
        <button id="helpButton" class="pixel-btn" type="button" data-tip="Abre la ayuda visual del juego.">Ayuda</button>
        <button id="magnitudesButton" class="pixel-btn ref" type="button" data-tip="Referencia rápida: magnitudes reales usadas para equilibrar cosecha, malta, tina, alambique y barriles.">⚖️</button>
        <button id="debugFill" class="pixel-btn debug" type="button" data-tip="Debug: randomiza objetos y cantidades en rangos razonables.">Debug</button>
        <button id="toggleDebugView" class="pixel-btn eye" type="button" data-tip="Mostrar u ocultar zonas de interacción y calidades Q.">👁️</button>
        <button id="resetGame" class="pixel-btn danger" type="button" data-tip="Reinicia la partida y borra el guardado local del navegador.">Reset</button>
      </div>
    </section>

    <section id="field" class="zone drop-target" aria-label="Cultivo"></section>
    <section id="maltingWrap" class="zone">
      <div id="malting" aria-label="Malteado y germinación"></div>
    </section>

    <section id="fermentation" class="zone machines-grid" aria-label="Tinas de fermentación"></section>
    <section id="stillhouse" class="zone machines-grid" aria-label="Alambiques"></section>

    <section id="aging" class="zone storage-zone drop-target" aria-label="Almacén de barricas" data-tip="Nave de envejecimiento. Suelta destilado con dos pasadas para crear una barrica. Cada año pierde 5% de volumen. Puedes comprar barriles Bourbon/Jerez y reutilizarlos al embotellar."></section>
    <section id="bottling" class="zone bottling-zone drop-target" aria-label="Embotellado y tienda" data-tip="Arrastra barricas aquí para embotellar. Una barrica completa equivale a 1000 botellas: cada icono representa 10 barriles."></section>
    <section id="truckDock" class="zone truck-zone drop-target" aria-label="Muelles de carga" data-tip="Suelta cajas aquí para vender: precio de mercado en € x botella x años, multiplicado por calidad Q."></section>

    <button id="office" class="office-hotspot" data-tip="Pulsa para ver el menú (ESC)">Oficina</button>
    <button id="hudIcon" class="hud-icon" type="button" data-tip="Mostrar u ocultar panel de información y menú.">☰</button>
    <div id="helpModal" class="help-modal hidden" role="dialog" aria-modal="true"><img src="img/ayuda.png" alt="Ayuda de Miarma Distillery" /></div>
    <div id="magnitudesModal" class="reference-modal hidden" role="dialog" aria-modal="true"><button id="magnitudesClose" class="modal-close" type="button" aria-label="Cerrar referencia">×</button><iframe src="docs/magnitudes.html" title="Magnitudes de referencia" loading="lazy"></iframe></div>
    <div id="gamePopup" class="game-popup hidden" role="dialog" aria-modal="true"></div>
    <div id="tooltip" role="status"></div>
  </main>
  <script src="js/game.js"></script>
</body>
</html>
